# The hypothesis tree of study P1. An objective names a gap. Hypotheses split the gap into mutually exclusive
# stages of the decision and together cover every way a wrong decision can arise. Each hypothesis has key
# questions, each key question is tested by case families, and evidence rolls up bottom-up with its budget.
objective:
  id: O
  title: Where does the 4B decider's clinical safety decision-making break?
hypotheses:
  H1:
    title: "Reading: the critical fact is present but not extracted from the record"
    questions:
      Q1.1: {title: "a negated allergy is read as an allergy, or the reverse", families: [F1], conditions: [critical, benign]}
      Q1.2: {title: "irrelevant history distracts from the fact", families: [F5], conditions: [critical, benign]}
      Q1.3: {title: "a fact at the end of a long note is missed", families: [F6], conditions: [critical, benign]}
      Q1.4: {title: "two statements disagree and one is followed blindly", families: [F7], conditions: [critical, benign]}
  H2:
    title: "Computing: the fact is read but a value must be compared, computed or known"
    questions:
      Q2.1: {title: "a renal threshold (eGFR 30) is not applied", families: [F2], conditions: [critical, benign]}
      Q2.2: {title: "a result's magnitude is not recognised as urgent", families: [F3], conditions: [critical, benign]}
      Q2.3: {title: "a weight-based dose is not checked", families: [F9], conditions: [critical, benign]}
      Q2.4: {title: "a drug interaction is not known", families: [F10], conditions: [critical, benign]}
  H3:
    title: "Inferring: the state must be inferred from temporal or indirect evidence"
    questions:
      Q3.1: {title: "a historical risk factor is treated as current, or the reverse", families: [F4], conditions: [critical, benign]}
      Q3.2: {title: "pregnancy stated only indirectly is missed", families: [F8], conditions: [critical, benign]}
  H4:
    title: "Calibrating: the record is insufficient and the model commits anyway"
    questions:
      Q4.1: {title: "the critical fact is undocumented and the model proceeds or refuses", conditions: [absent]}
      Q4.2: {title: "the record conflicts and the model picks a side", conditions: [conflict]}
