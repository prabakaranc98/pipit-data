name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The docstring examples of the core, so a new example is run as soon as it is written. Not the adapters:
      # CI installs no extras, and the PyTorch-based adapters would fail to import.
      - run: uv run pytest --doctest-modules src/pipit --ignore=src/pipit/adapters
