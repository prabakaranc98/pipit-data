name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The docstring examples of the whole package, so a new example is run as soon as it is written. The adapters
      # import their model libraries inside functions, so they load without the extras.
      - run: uv run pytest --doctest-modules src/pipit
      # Every study report rebuilt from its recorded runs; fails when one differs from what its script writes.
      - run: uv run python studies/rebuild.py
