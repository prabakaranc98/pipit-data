name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The docstring examples, from the modules that have them. Not all of src: CI installs no extras, and the
      # PyTorch-based adapters would fail to import.
      - run: uv run pytest --doctest-modules src/pipit/preflight.py src/pipit/results.py
