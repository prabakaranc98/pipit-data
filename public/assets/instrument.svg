<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7942"/></marker><marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5e2a"/></marker></defs><rect x="0" y="0" width="1240" height="400" fill="#fcfcfa"/><text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111111" text-anchor="start" style="">The instrument</text><text x="40" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">A model is registered once, as a file. The study decides what it is for. The core never imports a model library.</text><rect x="60.0" y="120" width="250" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="76.0" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Manifest</text><text x="76.0" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">a YAML file: identifier, pinned</text><text x="76.0" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">revision, placement, device, dtype,</text><text x="76.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">the name of the key's env variable</text><rect x="350.0" y="120" width="250" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="366.0" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Adapter</text><text x="366.0" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">at the edge, the only place an SDK</text><text x="366.0" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">appears: PyTorch, MLX, vLLM, SGLang,</text><text x="366.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">TypeSafe, any OpenAI-style API</text><rect x="640.0" y="120" width="250" height="124" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="656.0" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Subject</text><text x="656.0" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">one contract for every model:</text><text x="656.0" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">state + typed questions → answers,</text><text x="656.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">with provenance, cost and time</text><rect x="930.0" y="120" width="250" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="946.0" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Role</text><text x="946.0" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">given by the study, not the model:</text><text x="946.0" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">candidate is only queried; reference</text><text x="946.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">is compared; lab models construct</text><polyline points="310.0,182.0 348.0,182.0" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600.0,182.0 638.0,182.0" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="890.0,182.0 928.0,182.0" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="60.0" y="288" width="1120" height="58" rx="8" fill="#f2f5ef"/><text x="76.0" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3d4a40" text-anchor="start" style="letter-spacing:0.12em">CORE</text><text x="76.0" y="332" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">questions · checks · evidence · ledger · cache · costs   —   plain Python, tested in CI, no model library</text><text x="40" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">Keys live in the environment. Manifests never hold them. Every request, live or replayed, leaves a ledger row.</text></svg>