<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7942"/></marker><marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5e2a"/></marker></defs><rect x="0" y="0" width="1400" height="540" fill="#fcfcfa"/><text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111111" text-anchor="start" style="">A Pipit study is a loop</text><text x="40" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">A question becomes cases with a known answer and runs with an accounted cost. The evidence either settles a claim or tells the next round where to look.</text><rect x="40" y="110" width="196" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="56" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Question</text><text x="56" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">a gap, split into hypotheses</text><text x="56" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">and key questions,</text><text x="56" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">written down first</text><rect x="266" y="110" width="196" height="124" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="282" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Cases</text><text x="282" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">families with a planted fact,</text><text x="282" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">so the right answer is known</text><text x="282" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">by construction</text><rect x="492" y="110" width="196" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="508" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Runs</text><text x="508" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">registered models in roles:</text><text x="508" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">candidate, reference, lab;</text><text x="508" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">every call cached and priced</text><rect x="718" y="110" width="196" height="124" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="734" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Evidence</text><text x="734" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">checks in code, cells with</text><text x="734" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">intervals, rolled up the tree</text><text x="734" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">with what each node cost</text><polyline points="236,172.0 264,172.0" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="462,172.0 490,172.0" fill="none" stroke="#4f7942" stroke-width="1.8" marker-end="url(#arrow-accent)"/><polyline points="688,172.0 716,172.0" fill="none" stroke="#4f7942" stroke-width="1.8" marker-end="url(#arrow-accent)"/><polygon points="1023.0,122 1098,172.0 1023.0,222 948,172.0" fill="white" stroke="#111111" stroke-width="1.5"/><text x="1023.0" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="middle" style="">sufficient?</text><text x="1023.0" y="185.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3d4a40" text-anchor="middle" style="">threshold fixed</text><text x="1023.0" y="198.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#3d4a40" text-anchor="middle" style="">in advance</text><polyline points="914,172.0 946,172.0" fill="none" stroke="#4f7942" stroke-width="1.8" marker-end="url(#arrow-accent)"/><rect x="1132" y="110" width="236" height="124" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="1148" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Finding</text><text x="1148" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">an audit claim: limitation, defect,</text><text x="1148" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">gap or next experiment, with its</text><text x="1148" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">cost and what is still unknown</text><polyline points="1098,172.0 1130,172.0" fill="none" stroke="#4f7942" stroke-width="1.8" marker-end="url(#arrow-accent)"/><text x="1104" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4f7942" text-anchor="start" style="font-style:italic">yes</text><rect x="1132" y="304" width="236" height="112" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="1148" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Child study, run by Pipit</text><text x="1148" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">the finding becomes the objective of</text><text x="1148" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">a nested study on the same engine:</text><text x="1148" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">new tree, held-out cases, its own</text><text x="1148" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">budget; studies form a tree too</text><polyline points="1250.0,234 1250.0,302" fill="none" stroke="#4f7942" stroke-width="1.8" marker-end="url(#arrow-accent)"/><rect x="286" y="304" width="499.6" height="92" rx="8" fill="white" stroke="#2f5e2a" stroke-width="1.5"/><text x="302" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start" style="">Expand</text><text x="302" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">lab models read the evidence and propose sharper hypotheses, questions and cases;</text><text x="302" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">they run only once pre-registered; the next budget goes where the evidence is thin</text><polyline points="1023.0,222 1023.0,350.0 787.6,350.0" fill="none" stroke="#2f5e2a" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow-return)"/><text x="1031.0" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2f5e2a" text-anchor="start" style="font-style:italic">no</text><polyline points="286,350.0 138.0,350.0 138.0,236" fill="none" stroke="#2f5e2a" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow-return)"/><text x="40" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">Nothing enters the evidence that is not code or recorded. Nothing a model proposes runs until it is pre-registered. Findings nest into child studies, so one engine scales from one question to a programme.</text></svg>