<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7942"/></marker></defs><rect x="0" y="0" width="1400" height="790" fill="#fcfcfa"/><text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111111" text-anchor="start" style="">Pipit as a study team (proposal)</text><text x="40" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">A lead model plans, specialists write, small models check, and every action goes through Pipit's tools into one record. A person signs the gates.</text><rect x="40" y="100" width="232" height="620" rx="8" fill="#f2f5ef"/><text x="54" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3d4a40" text-anchor="start" style="letter-spacing:0.12em">MODES</text><rect x="56" y="140" width="200" height="70" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="70" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Ground</text><text x="70" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">learn the business's world</text><rect x="56" y="236" width="200" height="70" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="70" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Explore</text><text x="70" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">small batches, many families</text><rect x="56" y="332" width="200" height="70" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="70" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Focus</text><text x="70" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">spend where evidence is thin</text><rect x="56" y="428" width="200" height="70" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="70" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Confirm</text><text x="70" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">frozen fresh cases, signed</text><rect x="56" y="524" width="200" height="70" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="70" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Explain</text><text x="70" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">why: pairs, ablations, fixes</text><rect x="56" y="620" width="200" height="70" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="70" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="start" style="">Watch</text><text x="70" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#111111" text-anchor="start" style="">canary, drift, expiry</text><polyline points="156.0,210 156.0,234" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="156.0,306 156.0,330" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="156.0,402 156.0,426" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="156.0,498 156.0,522" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="156.0,594 156.0,618" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="256,367 262,367 262,271" fill="none" stroke="#4f7942" stroke-width="1.6"/><polyline points="262,271 257,271" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="62" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3d4a40" text-anchor="start" style="font-style:italic">Explore and Focus repeat</text><rect x="300" y="100" width="1060" height="52" rx="8" fill="#f2f5ef"/><text x="314" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3d4a40" text-anchor="start" style="letter-spacing:0.12em">PERSON</text><text x="314" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111111" text-anchor="start" style="">signs the pre-registration · reads flags · keeps or drops proposals · opens and closes Confirm</text><rect x="300" y="180" width="520" height="98" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="314" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Lead model</text><text x="314" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">drafts and expands the tree, picks the mode and the next</text><text x="314" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">batch, writes proposals, asks for budget. Never scores a</text><text x="314" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">case, never sees Confirm results before the run closes.</text><rect x="850" y="180" width="510" height="98" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="864" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Council</text><text x="864" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">three models from different families review expected</text><text x="864" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">answers and findings before they count; when they</text><text x="864" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">disagree, the person decides.</text><polyline points="560,152 560,178" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><polyline points="820,229 848,229" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><polyline points="272,229 298,229" fill="none" stroke="#4f7942" stroke-width="1.6" marker-end="url(#a-acc)"/><polyline points="560,278 560,292" fill="none" stroke="#111111" stroke-width="1.6"/><polyline points="425,292 1235,292" fill="none" stroke="#111111" stroke-width="1.6"/><polyline points="425,292 425,306" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="300" y="308" width="250" height="88" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="314" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Tree designer</text><text x="314" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">keeps hypotheses exclusive</text><text x="314" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">and complete</text><polyline points="695,292 695,306" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="570" y="308" width="250" height="88" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="584" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Case writer</text><text x="584" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">plants the deciding fact</text><text x="584" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">in a real-sounding record</text><polyline points="965,292 965,306" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="840" y="308" width="250" height="88" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="854" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Critic</text><text x="854" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">hunts leaks, contestable</text><text x="854" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">answers, defective cases</text><polyline points="1235,292 1235,306" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="1110" y="308" width="250" height="88" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="1124" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Analyst</text><text x="1124" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">reads the evidence, writes</text><text x="1124" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">the three-voice report</text><rect x="300" y="426" width="1060" height="74" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="314" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Workers: small decision models such as Jev and local deciders</text><text x="314" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">thousands of cheap typed checks: does the fact survive the rewrite? does it read like a real message? which hypothesis does this failure</text><text x="314" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">belong to? Calibrated against planted truth. Never a subject in a study whose cases they filter.</text><polyline points="830,396 830,424" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="300" y="528" width="1060" height="60" rx="8" fill="#f2f5ef"/><text x="314" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3d4a40" text-anchor="start" style="letter-spacing:0.12em">PIPIT TOOLS</text><text x="314" y="568" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="normal" fill="#111111" text-anchor="start" style="">build cases · run subject · compute · check · evidence · certify · ledger · record decision</text><polyline points="830,500 830,526" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><polyline points="425,588 425,616" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="300" y="618" width="250" height="102" rx="8" fill="#eaf1e6" stroke="#111111" stroke-width="1.5"/><text x="314" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Study record</text><text x="314" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">one source of truth: tree,</text><text x="314" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">cases, runs, evidence,</text><text x="314" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">ledger, decision log</text><polyline points="695,588 695,616" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="570" y="618" width="250" height="102" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="584" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Knowledge graph</text><text x="584" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">across studies: what the</text><text x="584" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">field knows, what is open,</text><text x="584" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">what is only ours</text><polyline points="965,588 965,616" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="840" y="618" width="250" height="102" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="854" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Subjects</text><text x="854" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">candidate and reference:</text><text x="854" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">they only answer and never</text><text x="854" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">see the record</text><polyline points="1235,588 1235,616" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="1110" y="618" width="250" height="102" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/><text x="1124" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start" style="">Business context (MCP)</text><text x="1124" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">ontology, policies, tickets;</text><text x="1124" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">read-only, behind a</text><text x="1124" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111111" text-anchor="start" style="">data boundary</text><text x="40" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3d4a40" text-anchor="start" style="">Every call leaves a ledger row. The agent layer stays only if it beats the scripted loop on the bench at equal budget: more planted failures found, no more false claims.</text></svg>