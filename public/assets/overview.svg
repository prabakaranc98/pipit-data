<svg viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Pipit design overview: ask, frame and build, explore, confirm, deliver, with the instruments and record beneath" xmlns="http://www.w3.org/2000/svg"><style>.box{fill:#ffffff;stroke:#121512;stroke-width:1.2}.plan{stroke:#5c675d;stroke-dasharray:5 4}.t{fill:#121512;font:600 14px 'Helvetica Neue', Helvetica, Arial, sans-serif}.l{fill:#4a554c;font:400 11.5px 'Helvetica Neue', Helvetica, Arial, sans-serif}.s{fill:#4a554c;font:400 10.5px 'Helvetica Neue', Helvetica, Arial, sans-serif}.cap{fill:#4f7942;font:600 11px Menlo, Consolas, monospace;letter-spacing:.08em}.center{fill:#4f7942;font:600 12px Menlo, Consolas, monospace;letter-spacing:.06em}.motto{fill:#4f7942;font:600 12px 'Helvetica Neue', Helvetica, Arial, sans-serif}.ar{stroke:#121512;stroke-width:1.3;fill:none}.fb{stroke:#4f7942;stroke-width:1.6;fill:none;stroke-dasharray:6 4}.mk{fill:#121512}.mkf{fill:#4f7942}.edge{stroke:#8a958b;stroke-width:1}.st-sup{fill:#b5452b}.st-open{fill:#b7811a}.st-ref{fill:#4f7942}</style><rect width="1200" height="556" fill="#f7f8f5"/><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mkf"/></marker></defs><text x="20" y="18" class="cap" text-anchor="start">1  ASK</text><text x="250" y="18" class="cap" text-anchor="start">2  FRAME AND BUILD</text><text x="550" y="18" class="cap" text-anchor="start">3  EXPLORE</text><text x="875" y="18" class="cap" text-anchor="start">4  CONFIRM</text><text x="1015" y="18" class="cap" text-anchor="start">5  DELIVER</text><rect x="20" y="50" width="200" height="96" rx="6" class="box"/><text x="32" y="72" class="t" text-anchor="start">The job question</text><text x="32" y="92" class="l" text-anchor="start">Can this model act alone?</text><text x="32" y="108" class="l" text-anchor="start">A tolerance per job,</text><text x="32" y="124" class="l" text-anchor="start">set before any data</text><rect x="20" y="162" width="200" height="118" rx="6" class="box"/><text x="32" y="184" class="t" text-anchor="start">Models, as manifests</text><text x="32" y="204" class="l" text-anchor="start">candidates and references,</text><text x="32" y="220" class="l" text-anchor="start">helpers and judges;</text><text x="32" y="236" class="l" text-anchor="start">this Mac, a GPU or an API;</text><text x="32" y="252" class="l" text-anchor="start">the study sets each role</text><rect x="20" y="296" width="200" height="84" rx="6" class="box plan"/><text x="32" y="318" class="t" text-anchor="start">Real material</text><text x="32" y="338" class="l" text-anchor="start">Hub datasets as seeds,</text><text x="32" y="354" class="l" text-anchor="start">such as MedCalc-Bench</text><rect x="250" y="50" width="265" height="210" rx="6" class="box"/><text x="262" y="72" class="t" text-anchor="start">Hypothesis tree</text><text x="262" y="90" class="l" text-anchor="start">a partition of the case space</text><line x1="340" y1="112" x2="270" y2="152" class="edge"/><line x1="270" y1="152" x2="258" y2="194" class="edge"/><line x1="270" y1="152" x2="270" y2="194" class="edge"/><line x1="270" y1="152" x2="282" y2="194" class="edge"/><line x1="340" y1="112" x2="318" y2="152" class="edge"/><line x1="318" y1="152" x2="306" y2="194" class="edge"/><line x1="318" y1="152" x2="318" y2="194" class="edge"/><line x1="318" y1="152" x2="330" y2="194" class="edge"/><line x1="340" y1="112" x2="366" y2="152" class="edge"/><line x1="366" y1="152" x2="358" y2="194" class="edge"/><line x1="366" y1="152" x2="374" y2="194" class="edge"/><line x1="340" y1="112" x2="414" y2="152" class="edge"/><line x1="414" y1="152" x2="406" y2="194" class="edge"/><line x1="414" y1="152" x2="422" y2="194" class="edge"/><circle cx="340" cy="112" r="6" class="st-open"/><circle cx="270" cy="152" r="5" class="st-open"/><circle cx="258" cy="194" r="4" class="st-open"/><circle cx="270" cy="194" r="4" class="st-open"/><circle cx="282" cy="194" r="4" class="st-ref"/><circle cx="318" cy="152" r="5" class="st-sup"/><circle cx="306" cy="194" r="4" class="st-sup"/><circle cx="318" cy="194" r="4" class="st-open"/><circle cx="330" cy="194" r="4" class="st-open"/><circle cx="366" cy="152" r="5" class="st-open"/><circle cx="358" cy="194" r="4" class="st-sup"/><circle cx="374" cy="194" r="4" class="st-open"/><circle cx="414" cy="152" r="5" class="st-open"/><circle cx="406" cy="194" r="4" class="st-open"/><circle cx="422" cy="194" r="4" class="st-ref"/><text x="505" y="116" class="s" text-anchor="end">objective</text><text x="505" y="156" class="s" text-anchor="end">mechanisms</text><text x="505" y="198" class="s" text-anchor="end">key questions</text><text x="262" y="228" class="l" text-anchor="start">each node: a claim, a tolerance,</text><text x="262" y="244" class="l" text-anchor="start">a status and a cost</text><rect x="250" y="276" width="265" height="104" rx="6" class="box"/><text x="262" y="298" class="t" text-anchor="start">Cases with planted truth</text><text x="262" y="318" class="l" text-anchor="start">family specs and minimal pairs</text><text x="262" y="334" class="l" text-anchor="start">critical, benign, absent, conflict</text><text x="262" y="350" class="l" text-anchor="start">difficulty settings; code checks</text><text x="262" y="366" class="l" text-anchor="start">helpers scored before use</text><rect x="550" y="50" width="295" height="90" rx="6" class="box plan"/><text x="562" y="72" class="t" text-anchor="start">Adapt, every round</text><text x="562" y="92" class="l" text-anchor="start">split a node where the evidence divides</text><text x="562" y="108" class="l" text-anchor="start">propose a node for unexplained failures</text><text x="562" y="124" class="l" text-anchor="start">write a family to replicate a finding</text><rect x="550" y="158" width="140" height="62" rx="6" class="box"/><text x="562" y="180" class="t" text-anchor="start">Update</text><text x="562" y="200" class="l" text-anchor="start">per independent unit,</text><text x="562" y="214" class="l" text-anchor="start">an interval per node</text><rect x="705" y="158" width="140" height="62" rx="6" class="box"/><text x="717" y="180" class="t" text-anchor="start">Grade</text><text x="717" y="200" class="l" text-anchor="start">code first; measured</text><text x="717" y="214" class="l" text-anchor="start">judges where it cannot</text><rect x="705" y="318" width="140" height="62" rx="6" class="box"/><text x="717" y="340" class="t" text-anchor="start">Answer</text><text x="717" y="360" class="l" text-anchor="start">candidates in their</text><text x="717" y="374" class="l" text-anchor="start">model-card setup</text><rect x="550" y="318" width="140" height="62" rx="6" class="box plan"/><text x="562" y="340" class="t" text-anchor="start">Sample</text><text x="562" y="360" class="l" text-anchor="start">where a verdict is</text><text x="562" y="374" class="l" text-anchor="start">closest to its tolerance</text><text x="697" y="266" class="center" text-anchor="middle">EXPLORE</text><text x="697" y="282" class="s" text-anchor="middle">every batch</text><path d="M 690 349 L 703 349" class="ar" marker-end="url(#ma)"/><path d="M 775 318 L 775 222" class="ar" marker-end="url(#ma)"/><path d="M 705 189 L 692 189" class="ar" marker-end="url(#ma)"/><path d="M 620 220 L 620 316" class="ar" marker-end="url(#ma)"/><path d="M 620 158 L 620 142" class="ar" marker-end="url(#ma)"/><path d="M 845 95 L 873 95" class="ar" marker-end="url(#ma)"/><path d="M 550 95 L 517 95" class="fb" marker-end="url(#mf)"/><rect x="875" y="50" width="125" height="330" rx="6" class="box plan"/><text x="887" y="72" class="t" text-anchor="start">Confirm</text><text x="887" y="92" class="l" text-anchor="start">fresh families,</text><text x="887" y="108" class="l" text-anchor="start">held back from</text><text x="887" y="124" class="l" text-anchor="start">the loop</text><text x="887" y="156" class="l" text-anchor="start">tests registered</text><text x="887" y="172" class="l" text-anchor="start">in advance</text><text x="887" y="204" class="l" text-anchor="start">e-BH across</text><text x="887" y="220" class="l" text-anchor="start">claims</text><text x="887" y="252" class="l" text-anchor="start">run once;</text><text x="887" y="268" class="l" text-anchor="start">a person signs</text><text x="887" y="300" class="l" text-anchor="start">retired sets are</text><text x="887" y="316" class="l" text-anchor="start">published later</text><path d="M 937 50 L 937 36 L 340 36 L 340 48" class="fb" marker-end="url(#mf)"/><text x="745" y="31" class="s" text-anchor="middle">claims and priors for the next round</text><rect x="1015" y="50" width="165" height="96" rx="6" class="box"/><text x="1027" y="72" class="t" text-anchor="start">Reliance dossier</text><text x="1027" y="92" class="l" text-anchor="start">where the model breaks</text><text x="1027" y="108" class="l" text-anchor="start">how much it does alone</text><text x="1027" y="124" class="l" text-anchor="start">settings that matter, cost</text><rect x="1015" y="158" width="165" height="96" rx="6" class="box plan"/><text x="1027" y="180" class="t" text-anchor="start">Benchmark release</text><text x="1027" y="200" class="l" text-anchor="start">explore cases public</text><text x="1027" y="216" class="l" text-anchor="start">confirm held back</text><text x="1027" y="232" class="l" text-anchor="start">canary and fingerprint</text><rect x="1015" y="266" width="165" height="52" rx="6" class="box plan"/><text x="1027" y="288" class="t" text-anchor="start">Minimal pairs</text><text x="1027" y="308" class="l" text-anchor="start">for interpretability</text><rect x="1015" y="330" width="165" height="50" rx="6" class="box plan"/><text x="1027" y="352" class="t" text-anchor="start">Training data, later</text><text x="1027" y="372" class="l" text-anchor="start">only from confirmed limits</text><path d="M 1000 98 L 1013 98" class="ar" marker-end="url(#ma)"/><path d="M 1000 206 L 1013 206" class="ar" marker-end="url(#ma)"/><path d="M 1000 292 L 1013 292" class="ar" marker-end="url(#ma)"/><path d="M 1000 355 L 1013 355" class="ar" marker-end="url(#ma)"/><path d="M 220 98 L 248 98" class="ar" marker-end="url(#ma)"/><path d="M 220 221 L 248 221" class="ar" marker-end="url(#ma)"/><path d="M 220 338 L 248 338" class="ar" marker-end="url(#ma)"/><path d="M 382 260 L 382 274" class="ar" marker-end="url(#ma)"/><path d="M 515 349 L 548 349" class="ar" marker-end="url(#ma)"/><text x="20" y="402" class="cap" text-anchor="start">INSTRUMENTS AND RECORD</text><rect x="20" y="410" width="180" height="80" rx="6" class="box"/><text x="32" y="432" class="t" text-anchor="start">Ledger</text><text x="32" y="452" class="l" text-anchor="start">every call, priced,</text><text x="32" y="468" class="l" text-anchor="start">cost per role</text><rect x="216" y="410" width="180" height="80" rx="6" class="box"/><text x="228" y="432" class="t" text-anchor="start">Cache</text><text x="228" y="452" class="l" text-anchor="start">replays any request</text><text x="228" y="468" class="l" text-anchor="start">by its hash</text><rect x="412" y="410" width="180" height="80" rx="6" class="box plan"/><text x="424" y="432" class="t" text-anchor="start">The bench</text><text x="424" y="452" class="l" text-anchor="start">planted failures test</text><text x="424" y="468" class="l" text-anchor="start">the engine&#x27;s policies</text><rect x="608" y="410" width="180" height="80" rx="6" class="box plan"/><text x="620" y="432" class="t" text-anchor="start">Judge bench</text><text x="620" y="452" class="l" text-anchor="start">judges measured like</text><text x="620" y="468" class="l" text-anchor="start">models, per family</text><rect x="804" y="410" width="180" height="80" rx="6" class="box plan"/><text x="816" y="432" class="t" text-anchor="start">Versions</text><text x="816" y="452" class="l" text-anchor="start">git today; DVC and</text><text x="816" y="468" class="l" text-anchor="start">Hub tags next</text><rect x="1000" y="410" width="180" height="80" rx="6" class="box plan"/><text x="1012" y="432" class="t" text-anchor="start">Agent team</text><text x="1012" y="452" class="l" text-anchor="start">lead, writers, critics,</text><text x="1012" y="468" class="l" text-anchor="start">workers, council: 0.2</text><rect x="20" y="514" width="22" height="14" rx="3" class="box"/><text x="48" y="525" class="s" text-anchor="start">built</text><rect x="96" y="514" width="22" height="14" rx="3" class="box plan"/><text x="124" y="525" class="s" text-anchor="start">planned</text><path d="M 190 521 L 222 521" class="fb" marker-end="url(#mf)"/><text x="230" y="525" class="s" text-anchor="start">feedback</text><circle cx="310" cy="521" r="5" class="st-sup"/><text x="320" y="525" class="s" text-anchor="start">supported</text><circle cx="392" cy="521" r="5" class="st-open"/><text x="402" y="525" class="s" text-anchor="start">open</text><circle cx="452" cy="521" r="5" class="st-ref"/><text x="462" y="525" class="s" text-anchor="start">refuted</text><text x="1180" y="525" class="motto" text-anchor="end">Models write, statistics allocate, code grades, people decide.</text></svg>