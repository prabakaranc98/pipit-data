[project]
name = "pipit-data"
version = "0.0.3"
description = "A data-first workbench for measuring and improving AI systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prabakaran Chandran" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Adapters live at the edge; the core imports none of these. Pins follow the stacks the candidates were evaluated on.
local = [
    "torch>=2.8",
    "torchvision>=0.29,<0.30",
    "transformers==5.21.0",
    "safetensors>=0.4",
    "huggingface-hub>=1.31,<2.0",
    "pillow>=10",
]
typesafe = ["typesafe-sdk==0.7.1"]
# Apple silicon only: MLX serves LLMs through an OpenAI-style endpoint (pipit.adapters.openai_compat).
mlx = ["mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipit"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"studies/**" = ["E501"]  # case text, prompts and report rows are prose; wrapping them would change the material

[tool.pytest.ini_options]
testpaths = ["tests"]
